<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self'">
  <title>秒记</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-note" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M3 1h8v2h2v12H3zM5 4h3v1H5zM5 7h6v1H5zM5 10h6v1H5z"/>
    </symbol>
    <symbol id="i-flame" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M8 1h2v3h2v2h2v5h-2v2h-2v2H6v-2H4v-2H2V7h2V5h2V3h2zM8 9h2v4H7V9h1z"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M6 1h4v3h3v3h3v4h-3v3h-3v2H6v-3H3v-3H1V6h3V3h3zM6 6v4h4V6z"/>
    </symbol>
    <symbol id="i-book" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M3 1h10v14H3zM5 4h2v8H5z"/>
    </symbol>
    <symbol id="i-timeline" viewBox="0 0 16 16">
      <path d="M2 1h2v14H2zM4 3h7v2H4zM4 7h10v2H4zM4 11h5v2H4z"/>
    </symbol>
    <symbol id="i-chat" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M2 2h12v8h-7l-3 3v-3H2zM4 5h2v1H4zM7 5h2v1H7zM10 5h2v1h-2zM4 7h8v1H4z"/>
    </symbol>
    <symbol id="i-speaker" viewBox="0 0 16 16">
      <path d="M2 6h3v4H2zM5 5h2v6H5zM7 3h2v10H7zM10 6h1v4h-1zM12 4h1v8h-1zM14 2h1v12h-1z"/>
    </symbol>
    <symbol id="i-clipboard" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M6 1h4v2h2v12H4V3h2zM6 3v1h4V3zM6 6h4v1H6zM6 9h4v1H6zM6 12h3v1H6z"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 16 16">
      <path d="M3 3h2v2H3zM5 5h2v2H5zM7 7h2v2H7zM9 9h2v2H9zM11 11h2v2h-2z"/>
      <path d="M11 3h2v2h-2zM9 5h2v2H9zM7 7h2v2H7zM5 9h2v2H5zM3 11h2v2H3z"/>
    </symbol>
    <symbol id="i-open" viewBox="0 0 16 16">
      <path d="M8 2h6v6h-2V5.4L7.4 10 6 8.6 10.6 4H8zM2 4h5v2H4v6h6V9h2v5H2z"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 16 16">
      <path d="M2 8h3v2h2v2h2V9h2V7h3V5h-3v2H9v2H7V7H5V5H2zM2 8v3h2V8z"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M6 1h4v2h4v2H2V3h4zM3 6h10v9H3zM5 7v6h1V7zM10 7v6h1V7z"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 16 16">
      <path d="M2 7h9v2H2zM9 4h2v3H9zM11 6h2v4h-2zM9 9h2v3H9z"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M6 2h4v2h2v2h2v4h-2v2H8v-2H6V8H4V4h2zM6 4v4h4V4zM10 10h2v2h2v2h-2v-2h-2z"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 16 16">
      <path d="M7 1h2v14H7zM1 7h14v2H1zM5 5h2v2H5zM9 5h2v2H9zM5 9h2v2H5zM9 9h2v2H9z"/>
    </symbol>
    <symbol id="i-bulb" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M6 1h4v2h2v3h2v3h-2v2h-1v2H5v-2H4V9H2V6h2V3h2zM7 6h2v2H7z"/>
    </symbol>
    <symbol id="i-warn" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M7 1h2v2h2v2h2v2h2v2h1v4H0v-4h1V7h2V5h2V3h2zM7 5h2v4H7zM7 10h2v2H7z"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 16 16">
      <path d="M2 4h3v2h2v2h2v2h2V8h2V6h3v3h-2v2h-2v2H6v-2H4V9H2z"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 16 16">
      <path d="M7 2h2v12H7zM2 7h12v2H2z"/>
    </symbol>
    <symbol id="i-repeat" viewBox="0 0 16 16">
      <path d="M4 2h8v2H4zM3 4h2v7H3zM11 4h2v7h-2zM4 11h7v2H4zM11 9h3v3h-2v-1h-1z"/>
    </symbol>
    <symbol id="i-more" viewBox="0 0 16 16">
      <path d="M2 7h3v2H2zM7 7h3v2H7zM12 7h2v2h-2z"/>
    </symbol>
  </svg>

  <div id="pet" class="pet" role="button" tabindex="0" aria-label="打开秒记" title="秒记 · 点击展开，拖动移动">
    <div id="bubble" class="bubble hidden"><span id="petCount">0</span></div>
    <div id="petBody" class="pet-body">
      <img id="petImg" class="pet-img" src="assets/robot-idle.png" alt="" draggable="false">
    </div>
    <div class="pet-shadow" aria-hidden="true"></div>
  </div>

  <div id="panel" class="panel">
    <header class="panel-head">
      <div class="brand">
        <span class="avatar"><img id="headAvatar" src="assets/robot-idle.png" alt=""></span>
        <div class="brand-text">
          <h1><span class="brand-name">秒记</span><span class="caret" aria-hidden="true"></span></h1>
          <p id="headStat">今天还没查词</p>
        </div>
      </div>
      <div class="head-actions">
        <button class="icon-btn nav-icon active" data-tab="jot" title="查词" aria-label="查词">
          <svg class="ico"><use href="#i-note"></use></svg>
        </button>
        <button class="icon-btn nav-icon" data-tab="hot" id="btnHot" title="热词" aria-label="热词">
          <svg class="ico"><use href="#i-flame"></use></svg>
          <span id="hotCount" class="nav-badge hidden">0</span>
        </button>
        <button class="icon-btn nav-icon" data-tab="settings" title="设置" aria-label="设置">
          <svg class="ico"><use href="#i-gear"></use></svg>
        </button>
        <button class="icon-btn" id="btnOpenNote" title="打开 Obsidian 生词本" aria-label="打开 Obsidian 生词本">
          <svg class="ico"><use href="#i-open"></use></svg>
        </button>
        <button class="icon-btn" id="btnCollapse" title="收起（Esc）" aria-label="收起">
          <svg class="ico"><use href="#i-x"></use></svg>
        </button>
      </div>
    </header>
    <div class="panel-dither" aria-hidden="true"></div>

    <main class="views">
      <section id="view-jot" class="view active">
        <div id="composerWrap" class="composer-wrap">
          <div class="composer">
            <textarea id="input" rows="2" spellcheck="false" placeholder="粘贴或输入英文单词 / 句子…"></textarea>
            <div class="composer-bar">
              <button id="clipChip" class="clip-chip hidden" title="点击填入剪贴板内容"></button>
              <button id="btnParse" class="btn primary parse-btn">
                <span>解析</span><svg class="ico sm"><use href="#i-send"></use></svg>
              </button>
            </div>
          </div>
        </div>

        <div id="result" class="result"></div>
      </section>

      <section id="view-hot" class="view">
        <div class="view-head">
          <div>
            <h2 class="view-title">热词榜</h2>
          </div>
          <span id="hotHeadCount" class="count-tag">0</span>
        </div>
        <div class="hot-toolbar">
          <div class="search-wrap">
            <svg class="ico sm"><use href="#i-search"></use></svg>
            <input id="hotSearch" class="search" type="text" placeholder="搜索词条或释义…" spellcheck="false">
          </div>
          <div class="seg" id="hotSeg">
            <button data-filter="hot" class="active">热词</button>
            <button data-filter="all">全部</button>
            <button data-filter="mastered">掌握</button>
          </div>
        </div>
        <div id="hotList" class="hot-list"></div>
      </section>

      <section id="view-settings" class="view">
        <div class="view-head">
          <div>
            <h2 class="view-title">设置</h2>
          </div>
        </div>
        <div class="settings">
          <section class="settings-group">
            <h3 class="settings-group-title">AI 解析</h3>
            <div class="field">
              <label for="cfgKey">DeepSeek API Key</label>
              <input id="cfgKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
              <p class="help">只保存在本机，用 Windows 凭据加密。</p>
            </div>
            <div class="field two">
              <div>
                <label for="cfgBase">接口地址</label>
                <input id="cfgBase" type="text" spellcheck="false">
              </div>
              <div>
                <label for="cfgModel">模型</label>
                <input id="cfgModel" type="text" spellcheck="false">
              </div>
            </div>
            <div class="field">
              <label for="cfgFile">Obsidian 生词本</label>
              <div class="row">
                <input id="cfgFile" type="text" readonly>
                <button id="btnChoose" class="btn ghost sm">选择</button>
              </div>
            </div>
            <div class="field two">
              <div>
                <label for="cfgThreshold">热词阈值（次）</label>
                <input id="cfgThreshold" type="number" min="1" max="99">
              </div>
              <div>
                <label for="cfgLimit">热词榜上限</label>
                <input id="cfgLimit" type="number" min="1" max="50">
              </div>
            </div>
            <div class="settings-actions">
              <button id="btnTest" class="btn ghost">测试连接</button>
              <button id="btnSaveCfg" class="btn primary">保存</button>
            </div>
          </section>

          <section class="settings-group">
            <h3 class="settings-group-title">应用</h3>
            <label class="switch">
              <input type="checkbox" id="cfgLaunch">
              <span class="switch-track"></span>
              <span class="switch-label">开机自动启动</span>
            </label>
          </section>

          <section class="settings-group">
            <h3 class="settings-group-title">存储</h3>
            <div class="path-box">
              <div class="path-line"><span class="path-key">数据</span><span id="dataDir" class="path-val">—</span><button id="btnDataDir" class="path-open" title="在资源管理器中打开数据目录">打开</button></div>
              <div class="path-line"><span class="path-key">程序</span><span id="installDir" class="path-val">—</span></div>
              <p class="path-note">程序默认 D:\秒记，数据默认 D:\秒记数据；无 D 盘才回退 C 盘。</p>
            </div>
            <button id="btnSync" class="link-btn">
              <svg class="ico sm"><use href="#i-repeat"></use></svg>
              按本地记录重新生成整篇笔记
            </button>
          </section>

          <section class="settings-group">
            <h3 class="settings-group-title">快捷键</h3>
            <div class="key-list">
              <div class="key-row"><kbd>Enter</kbd><span>解析当前输入</span></div>
              <div class="key-row"><kbd>Shift + Enter</kbd><span>输入框内换行</span></div>
              <div class="key-row"><kbd>Esc</kbd><span>收起面板</span></div>
              <div class="key-row"><kbd>Ctrl + Alt + M</kbd><span>全局唤出 / 收起</span></div>
            </div>
          </section>

          <p class="foot-note">数据仅存本机 · 等宽字体 Consolas</p>
        </div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div id="modalCard" class="modal-card"></div></div>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
